name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: New version (e.g. 0.5.5)
        required: true
        type: string
      expected_sha:
        description: Exact source commit on main
        required: true
        type: string
      dry_run:
        description: Validate artifacts only; do not create a release
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: corte-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    outputs:
      version: ${{ steps.request.outputs.version }}
      sha: ${{ steps.request.outputs.sha }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate request without building or publishing
        id: request
        run: |
          export VERSION="${VERSION#v}"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF" = "refs/tags/v$VERSION"
            test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          else
            test "$GITHUB_REF" = refs/heads/main
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          node --input-type=module - <<'JS'
          import {validateVersion} from './scripts/release.mjs';
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const v=validateVersion(process.env.VERSION,JSON.parse(readFileSync('package.json')).version);
          const tags=execFileSync('gh',['api','--paginate','repos/Marcos-An/corte/releases','--jq','.[].tag_name'],{encoding:'utf8'}).trim().split('\n');
          for(const tag of tags)if(/^v\d+\.\d+\.\d+$/.test(tag))validateVersion(v,tag.slice(1));
          const refs=execFileSync('gh',['api','repos/Marcos-An/corte/git/matching-refs/tags/v'+v],{encoding:'utf8'});
          if(JSON.parse(refs).some(r=>r.ref==='refs/tags/v'+v)&&(process.env.GITHUB_EVENT_NAME!=='push'||process.env.GITHUB_REF!=='refs/tags/v'+v))throw Error('Tag already exists');
          JS
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
          - os: windows-2025
            platform: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      CORTE_DISTRIBUTION_PLATFORM: ${{ matrix.platform }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Scan tracked source (sanitized locations only)
        run: |
          node --input-type=module - <<'JS'
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          const pattern=/\b(?:sk-(?:proj-)?[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|AIza[A-Za-z0-9_-]{30,})|-----BEGIN (?:RSA |OPENSSH |EC )?PRIVATE KEY-----/;
          const hits=[];for(const file of execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean)){
            readFileSync(file,'utf8').split('\n').forEach((line,i)=>{if(pattern.test(line))hits.push(file+':'+(i+1));});
          }
          if(hits.length)throw Error('Potential secrets: '+hits.join(', '));
          JS
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: corte-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/release-bootstrap.json', 'vendor/models/manifest.json', 'vendor/distribution/manifest.json') }}
          path: |
            vendor/models
            vendor/darwin-arm64/ffmpeg
            vendor/darwin-arm64/ffprobe
            vendor/darwin-arm64/yt-dlp
            vendor/windows/ffmpeg.exe
            vendor/windows/ffprobe.exe
            vendor/windows/yt-dlp.exe
            vendor/windows/codex.exe
            vendor/windows/codex-code-mode-host.exe
            vendor/distribution/*-sources.tar.gz
      - name: Restore hash-pinned bootstrap tools and models
        run: node scripts/prepare-release.mjs --bootstrap-media
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        if: matrix.platform == 'win'
        with:
          msystem: MINGW64
          update: true
          install: >-
            make curl tar xz diffutils perl python
            mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm
      - name: Compile controlled Windows tools with SIMD and hardware decoding
        if: matrix.platform == 'win'
        shell: msys2 {0}
        env:
          CORTE_BUILD_JOBS: 4
        run: |
          export CORTE_FFMPEG_WORK=/tmp/corte-gpl-windows-build
          mkdir -p "$CORTE_FFMPEG_WORK"
          tar -xzf vendor/distribution/ffmpeg-windows-sources.tar.gz -C "$CORTE_FFMPEG_WORK"
          bash vendor/distribution/build-windows.sh
      - name: Record the dependency artifacts actually packaged
        run: |
          if [ "$CORTE_DISTRIBUTION_PLATFORM" = win ]; then
            node scripts/record-windows-media.mjs
          else
            node scripts/record-windows-media.mjs --bootstrap-source-only
          fi
      - run: npm ci
      - name: Stamp build version (source ref remains immutable)
        run: npm version "$VERSION" --no-git-tag-version --ignore-scripts
      - run: npm test
      - run: npm run check
      - name: Build native installer without publishing
        run: npm run dist:${{ matrix.platform }} -- --publish never
      - name: Audit packaged files, licenses, sources and hashes
        run: node tests/distribution.integration.mjs
      - name: Exercise packaged application and real MP4
        run: |
          if [ "$CORTE_DISTRIBUTION_PLATFORM" = mac ]; then
            export CORTE_TEST_APP="$PWD/release/mac-arm64/Corte.app/Contents/MacOS/Corte"
          else
            export CORTE_TEST_APP="$(node -p "require('node:path').resolve('release/win-unpacked/Corte.exe')")"
          fi
          node -e "if(!require('node:fs').existsSync(process.env.CORTE_TEST_APP))throw Error('Packaged executable not found')"
          DEBUG=pw:browser node tests/ai-complex.e2e.mjs
          node tests/video-still.e2e.mjs
      - name: Verify and collect final assets
        run: |
          mkdir -p release/assets
          if [ "$CORTE_DISTRIBUTION_PLATFORM" = mac ]; then
            hdiutil verify "release/Corte-$VERSION-arm64.dmg"
            unzip -t "release/Corte-$VERSION-arm64-mac.zip" > /dev/null
            cp "release/Corte-$VERSION-arm64.dmg" "release/Corte-$VERSION-arm64-mac.zip" release/assets/
            cp vendor/distribution/ffmpeg-macos-sources.tar.gz release/assets/
          else
            cp "release/Corte Setup $VERSION.exe" "release/assets/Corte.Setup.$VERSION.exe"
            cp vendor/distribution/ffmpeg-windows-sources.tar.gz release/assets/
          fi
      - name: Build and audit Windows automatic update without AI weights
        if: ${{ matrix.platform == 'win' }}
        run: |
          npm run dist:update:win -- --publish never
          CORTE_DISTRIBUTION_UPDATE=1 node tests/distribution.integration.mjs
          cp "release/update/Corte.Update.$VERSION.exe" "release/update/Corte.Update.$VERSION.exe.blockmap" release/update/latest.yml release/assets/
      - name: Save/open regressions on packaged application
        run: |
          if [ "$CORTE_DISTRIBUTION_PLATFORM" = mac ]; then
            export CORTE_TEST_APP="$PWD/release/mac-arm64/Corte.app/Contents/MacOS/Corte"
          else
            export CORTE_TEST_APP="$(node -p "require('node:path').resolve('release/win-unpacked/Corte.exe')")"
          fi
          node tests/import-progress.e2e.mjs
          node tests/project-hydration.e2e.mjs
          node tests/project-save.e2e.mjs
          node tests/save-reopen.e2e.mjs
          node tests/playhead-scroll.e2e.mjs
          node tests/updater-download.integration.mjs
          node tests/update-ui.e2e.mjs
          node tests/hybrid-edit.e2e.mjs
          node tests/ai-scope.e2e.mjs
          node tests/ai-stages.e2e.mjs
          node tests/interval-controls.e2e.mjs
          node tests/clean-editing.e2e.mjs
          node tests/subtitle-files.e2e.mjs
          node tests/local-captions.e2e.mjs
          CORTE_TEST_CAPTION_LANGUAGE=en node tests/local-captions.e2e.mjs
          node tests/speech-language.integration.mjs
          node tests/caption-proposal.e2e.mjs
          node tests/caption-reuse.integration.mjs
          node tests/caption-feedback.e2e.mjs
          node tests/audio-ranges.e2e.mjs
          node tests/keyframe-curves.e2e.mjs
          CORTE_TEST_EASING=ease-in-out node tests/keyframes-preview.e2e.mjs
          node tests/freeze-frame.e2e.mjs
          node tests/session-diagnostics.e2e.mjs
          node tests/visual-process.e2e.mjs
          node tests/edit-quality.integration.mjs
          node tests/speech-timing.integration.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: release/assets/*
  draft:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          merge-multiple: true
          path: release/assets
      - name: Install checksum/feed validator dependencies (no lifecycle scripts)
        env:
          GH_TOKEN: ""
        run: npm ci --ignore-scripts
      - name: Require both platforms and checksum every asset
        run: node scripts/release-assets.mjs release/assets "$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-verified
          if-no-files-found: error
          retention-days: 7
          path: release/assets/*
      - name: Create draft only after all gates pass
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: |
          printf 'Curvas suaves e transcrição em mais idiomas:\n- Curvas Linear, Acelerar, Desacelerar e Suave entre pontos de animação de texto, imagem, vídeo e forma.\n- Aparos e novos pontos preservam o movimento; controles de curva e pedidos por prompt conservam as poses existentes.\n- Escolha do idioma do áudio ou detecção automática no reconhecimento local, salva no projeto e com caches separados.\n- Legendas da narração respeitam o fim do vídeo após cortes e mudanças de velocidade, preservando áudio e transcrição.\n- Correção da sincronização por quadro de texto e formas animadas na exportação.\n- Painel de legendas mais compacto, com instalação do modelo preciso recolhida.\n\nVolumes continuam manuais, sem redução automática. Tradução e rampas de velocidade não estão incluídas. Reconhecimento local pode errar; revise os textos.\nWindows: atualização automática sem baixar novamente os modelos básicos.\nMac arm64 e Windows x64, sem assinatura/notarização. Fontes GPL e SHA256SUMS incluídos. Testes e auditorias dos pacotes executados nos runners.\n\nSource commit: %s. Build version: %s (stamped in CI).\n' "$EXPECTED_SHA" "$VERSION" > release/notes.md
          gh release create "v$VERSION" --repo Marcos-An/corte --target "$EXPECTED_SHA" --draft --prerelease --title "Corte $VERSION — beta" --notes-file release/notes.md release/assets/*
      - name: Publish explicitly requested version tag after all validations
        if: github.event_name == 'push'
        run: gh release edit "v$VERSION" --repo Marcos-An/corte --draft=false --prerelease=false --latest
