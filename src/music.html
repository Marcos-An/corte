<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src https://*.ytimg.com https://*.googleusercontent.com data:; media-src corte-media:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>Músicas</title><link rel="stylesheet" href="music.css"></head><body><main><h1>Músicas</h1><form class="search" id="search"><input id="query" aria-label="Buscar músicas" placeholder="Música ou artista…"><button class="primary">Buscar</button><button type="button" id="trending">Em alta</button></form><div id="status" class="status" role="status"></div><div class="layout"><section id="list" class="list" aria-label="Resultados"></section><aside><p id="empty">Selecione uma música para ouvir e escolher um trecho.</p><div id="player" hidden><button id="music-back" type="button">← Escolher outra música</button><div class="song-header"><img id="cover" alt="Capa da música"><div class="song-meta"><h2 id="title"></h2><p id="artist"></p></div></div><div class="clip-header"><span>Arraste as pontas</span><input id="length" type="hidden" value="30"><span id="duration-label">30s</span></div><input id="start" type="hidden" value="0"><div id="time-rail"><div id="time-track"><div id="ticks"></div><div id="played-bars" aria-hidden="true" hidden></div></div><div id="clip-window" role="slider" tabindex="0" aria-label="Escolher início do trecho" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-disabled="true"><button id="resize-left" class="resize-grip" aria-label="Ajustar início do trecho" title="Arraste para ajustar início">⋮</button><span id="clip-label">30s</span><button id="resize-right" class="resize-grip" aria-label="Ajustar fim do trecho" title="Arraste para ajustar fim">⋮</button></div></div><p id="replay-status"></p><p id="clip-status"></p><audio id="audio" preload="metadata"></audio><p id="audio-status" role="status"></p><button id="play-audio" class="primary" disabled>Carregando áudio…</button><button id="add-music" class="primary" disabled>Adicionar trecho</button></div></aside></div></main>
<script type="module" src="music-panel.mjs"></script></body></html>
